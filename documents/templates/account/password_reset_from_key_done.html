{% load static %}
<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Password Changed — DocuMind AI</title>
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">
    
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
    <link href="{% static 'css/documind.css' %}?v={% now 'U' %}" rel="stylesheet">

    <style>
        body.documind-app {
            background-color: #070a12;
            color: #f1f5f9;
            font-family: 'Plus Jakarta Sans', system-ui, sans-serif;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 2rem 1rem;
            position: relative;
            overflow: hidden;
        }
        .dm-reset-orb {
            position: absolute;
            border-radius: 50%;
            filter: blur(100px);
            pointer-events: none;
            opacity: 0.35;
        }
        .dm-reset-orb-1 {
            width: 380px;
            height: 380px;
            background: linear-gradient(135deg, #10b981, #3b82f6);
            top: 5%;
            left: 10%;
        }
        .dm-reset-card {
            width: 100%;
            max-width: 460px;
            background: rgba(15, 23, 42, 0.85);
            backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 1.25rem;
            padding: 2.5rem;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5), 0 0 40px rgba(16, 185, 129, 0.12);
            position: relative;
            z-index: 10;
            text-align: center;
        }
        .dm-btn-primary-glow {
            width: 100%;
            padding: 0.85rem 1.5rem;
            border-radius: 0.85rem;
            background: linear-gradient(135deg, #6366f1 0%, #4f46e5 50%, #4338ca 100%);
            border: none;
            color: #ffffff;
            font-weight: 700;
            font-size: 0.95rem;
            box-shadow: 0 4px 18px rgba(99, 102, 241, 0.35);
            transition: all 0.2s ease;
            cursor: pointer;
            text-decoration: none;
            display: inline-block;
        }
        .dm-btn-primary-glow:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 24px rgba(99, 102, 241, 0.48);
            color: #ffffff;
        }
    </style>
</head>
<body class="documind-app">

    <div class="dm-reset-orb dm-reset-orb-1"></div>

    <div class="dm-reset-card">
        <div class="mb-4">
            <div class="d-inline-flex align-items-center justify-content-center rounded-circle mb-3" style="width: 64px; height: 64px; background: rgba(16, 185, 129, 0.15); border: 1px solid rgba(16, 185, 129, 0.3);">
                <i class="bi bi-check2-circle text-success fs-1"></i>
            </div>
            <h1 class="h4 text-light fw-bold mb-2">Password Changed Successfully</h1>
            <p class="text-secondary small mb-4">Your DocuMind AI password has been updated. You can now sign in with your new credentials.</p>
            
            <a href="{% url 'account_login' %}" class="dm-btn-primary-glow">
                Sign In to DocuMind AI
            </a>
        </div>
    </div>

</body>
</html>
