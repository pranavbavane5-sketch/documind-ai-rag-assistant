{% load static %}
<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reset Email Sent — DocuMind AI</title>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
    <link href="{% static 'css/documind.css' %}?v={% now 'U' %}" rel="stylesheet">
    <style>
        body.documind-app {
            background-color: #070a12;
            color: #f1f5f9;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 2rem 1rem;
        }
        .dm-reset-card {
            width: 100%;
            max-width: 460px;
            background: rgba(15, 23, 42, 0.85);
            backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 1.25rem;
            padding: 2.5rem;
            text-align: center;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
        }
    </style>
</head>
<body class="documind-app">
    <div class="dm-reset-card">
        <div class="dm-brand-symbol mx-auto mb-3" style="width: 52px; height: 52px; background: rgba(16, 185, 129, 0.15); border: 1px solid rgba(16, 185, 129, 0.3);">
            <i class="bi bi-envelope-check-fill text-success fs-3"></i>
        </div>
        <h2 class="h4 text-light fw-bold mb-2">Check Your Inbox</h2>
        <p class="text-secondary small mb-4">
            We have sent password reset instructions to your email address if an account exists under that name.
        </p>
        <a href="{% url 'account_login' %}" class="btn btn-primary w-100 py-2 rounded-3 fw-semibold">
            Return to Sign In
        </a>
    </div>
</body>
</html>
