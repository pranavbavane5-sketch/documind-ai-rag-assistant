{% load static %}
<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign Out — DocuMind AI</title>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
    <link href="{% static 'css/documind.css' %}?v={% now 'U' %}" rel="stylesheet">
    <style>
        .dm-auth-viewport {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 2rem 1rem;
            background: radial-gradient(circle at 50% 20%, rgba(99, 102, 241, 0.15) 0%, rgba(15, 23, 42, 0.95) 75%), #090d16;
        }
        .dm-auth-card {
            width: 100%;
            max-width: 420px;
            background: rgba(15, 23, 42, 0.85);
            backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 1.25rem;
            padding: 2.25rem;
            text-align: center;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
        }
    </style>
</head>
<body class="documind-app">
    <div class="dm-auth-viewport">
        <div class="dm-auth-card">
            <div class="dm-brand-symbol mx-auto mb-3" style="width: 48px; height: 48px;">
                <i class="bi bi-box-arrow-right text-light fs-4"></i>
            </div>
            <h2 class="h4 text-light fw-bold mb-2">Sign Out</h2>
            <p class="text-secondary small mb-4">Are you sure you want to end your active DocuMind AI session?</p>

            <form method="post" action="{% url 'account_logout' %}">
                {% csrf_token %}
                <button type="submit" class="btn btn-danger w-100 py-2 mb-2 rounded-3 fw-semibold">
                    <i class="bi bi-box-arrow-right me-1"></i> Yes, Sign Out
                </button>
                <a href="/" class="btn btn-outline-secondary w-100 py-2 rounded-3 text-light">Cancel and Return</a>
            </form>
        </div>
    </div>
</body>
</html>
